global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alert.rules.yml

scrape_configs:
  - job_name: fanshi-backend
    metrics_path: /api/metrics
    static_configs:
      - targets:
          - 127.0.0.1:5000

  - job_name: node-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9100

  - job_name: mysql-exporter
    static_configs:
      - targets:
          - 127.0.0.1:9104
